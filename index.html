<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - Felix Delivery</title>
  <style>
    :root {
      --bg: #0f0f12;
      --card: #1a1a20;
      --accent: #00d4ff;
      --green: #00ff9d;
      --red: #ff3b5c;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      color: #e0e0e0;
      padding: 15px;
    }
    .container { max-width: 1200px; margin: auto; }

    header {
      background: linear-gradient(135deg, #1a1a20, #25252e);
      padding: 18px 25px;
      border-radius: 16px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      margin: 15px 0;
      border: 1px solid #2a2a32;
    }

    button {
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      margin: 6px 8px 6px 0;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-danger { background: var(--red); color: white; }
    .btn-back { background: #333; color: white; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #1f1f28;
      padding: 25px;
      border-radius: 16px;
      width: 90%;
      max-width: 420px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: #2a2a32;
      border: none;
      border-radius: 8px;
      color: white;
    }
  </style>
</head>
<body>

<div class="container">

  <header>
    <h2>🔧 Painel Admin - Felix Delivery</h2>
    <button onclick="logout()" style="background:#c62828;">Sair</button>
  </header>

  <!-- LOGIN -->
  <div id="login">
    <h2>🔑 Login Administrativo</h2>
    <input type="text" id="usuario" placeholder="Usuário" value="admin"><br><br>
    <input type="password" id="senha" placeholder="Senha" value="123"><br><br>
    <button class="btn-primary" onclick="entrar()" style="width:100%; padding:16px;">Entrar</button>
  </div>

  <!-- DASHBOARD -->
  <div id="painel" style="display:none;">
    <h2>Dashboard</h2>
    <div style="margin: 20px 0;">
      <button class="btn-primary" onclick="abrirPedidos()">📋 Todos os Pedidos</button>
      <button class="btn-primary" onclick="abrirCancelados()">❌ Pedidos Cancelados</button>
      <button class="btn-primary" onclick="abrirProdutos()">📦 Gerenciar Produtos</button>
    </div>
    <div style="display:flex; gap:20px; flex-wrap:wrap;">
      <div class="card" style="flex:1; text-align:center;">
        <h3>Total de Pedidos</h3>
        <h1 id="total-pedidos" style="color:var(--accent); font-size:42px;">0</h1>
      </div>
      <div class="card" style="flex:1; text-align:center;">
        <h3>Valor Total</h3>
        <h1 id="valor-total" style="color:var(--green); font-size:42px;">R$ 0,00</h1>
      </div>
    </div>
  </div>

  <!-- TODOS OS PEDIDOS -->
  <div id="pedidos-section" style="display:none;">
    <button class="btn-back" onclick="voltarParaMenu()">← Voltar</button>
    <h2>📋 Todos os Pedidos</h2>
    <div id="pedidos"></div>
  </div>

  <!-- PEDIDOS CANCELADOS -->
  <div id="cancelados-section" style="display:none;">
    <button class="btn-back" onclick="voltarParaMenu()">← Voltar</button>
    <h2>❌ Pedidos Cancelados</h2>
    <div id="cancelados"></div>
  </div>

  <!-- GERENCIAR PRODUTOS -->
  <div id="produtos-section" style="display:none;">
    <button class="btn-back" onclick="voltarParaMenu()">← Voltar</button>
    <h2>📦 Gerenciar Produtos</h2>
    <button class="btn-primary" onclick="novoProduto()">+ Novo Produto</button>
    <div id="listaProdutos"></div>
  </div>
</div>

<!-- MODAL PARA PRODUTOS -->
<div id="modalProduto" class="modal">
  <div class="modal-content">
    <h3 id="modalTitulo">Novo Produto</h3>
    
    <input type="text" id="prodNome" placeholder="Nome do produto" required>
    <input type="number" id="prodPreco" placeholder="Preço (ex: 29.90)" step="0.01" required>
    <input type="text" id="prodCategoria" placeholder="Categoria (ex: Lanches, Bebidas)">
    <input type="text" id="prodImagem" placeholder="URL da Imagem">

    <div style="margin-top:20px; display:flex; gap:10px;">
      <button class="btn-primary" onclick="salvarModal()" style="flex:1;">Salvar</button>
      <button class="btn-back" onclick="fecharModal()" style="flex:1;">Cancelar</button>
    </div>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwq56Z_nRq9QluckGZZ7tpxs5-VaE94pRt4RMyBsFL-57bEh8xB83vUYVUlXZurw1QNWQ/exec";

let produtoEditando = null;

// ==================== REQUISIÇÃO ====================
async function fazerRequisicao(dados) {
  try {
    const response = await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(dados),
      mode: "no-cors"   // ← Adicionado para ajudar
    });

    // Como no-cors não retorna body, vamos assumir sucesso se não der erro
    if (response) {
      return { success: true };
    }
    return { success: false };
  } catch (e) {
    console.error("Erro na requisição:", e);
    return { success: false };
  }
}

// ==================== LOGIN ====================
function entrar() {
  const usuario = document.getElementById("usuario").value;
  const senha = document.getElementById("senha").value;
  if (usuario === "admin" && senha === "123") {
    localStorage.setItem("adminLogado", "sim");
    mostrarPainel();
  } else {
    alert("Login inválido!");
  }
}

function mostrarPainel() {
  document.getElementById("login").style.display = "none";
  document.getElementById("painel").style.display = "block";
  carregarDashboard();
}

function logout() {
  localStorage.removeItem("adminLogado");
  location.reload();
}

function voltarParaMenu() {
  document.getElementById("painel").style.display = "block";
  document.getElementById("pedidos-section").style.display = "none";
  document.getElementById("cancelados-section").style.display = "none";
  document.getElementById("produtos-section").style.display = "none";
}

function abrirPedidos() {
  document.getElementById("painel").style.display = "none";
  document.getElementById("pedidos-section").style.display = "block";
  carregarPedidos();
}

function abrirCancelados() {
  document.getElementById("painel").style.display = "none";
  document.getElementById("cancelados-section").style.display = "block";
  carregarCancelados();
}

function abrirProdutos() {
  document.getElementById("painel").style.display = "none";
  document.getElementById("produtos-section").style.display = "block";
  carregarProdutos();
}

// ==================== DASHBOARD ====================
async function carregarDashboard() {
  try {
    const res = await fetch(API + "?pedidos=1");
    const pedidos = await res.json();
    const total = pedidos.length;
    const valor = pedidos.reduce((s, p) => s + parseFloat(p.total || 0), 0);
    document.getElementById("total-pedidos").textContent = total;
    document.getElementById("valor-total").textContent = "R$ " + valor.toFixed(2);
  } catch (e) { console.log(e); }
}

// ==================== PEDIDOS ====================
async function carregarPedidos() {
  try {
    const res = await fetch(API + "?pedidos=1");
    const pedidos = await res.json();
    let html = "";

    pedidos.reverse().forEach(p => {
      html += `
        <div class="card">
          <strong style="color:var(--accent)">Pedido #${p.idPedido}</strong><br><br>
          👤 ${p.cliente} | 📞 ${p.telefone}<br>
          📍 ${p.endereco}<br><br>
          🍔 ${p.itens}<br><br>
          💰 <strong style="color:var(--green)">R$ ${parseFloat(p.total||0).toFixed(2)}</strong><br><br>
          <div style="margin-top:15px;">
  <label>Status:</label><br><br>

  <select id="status-${p.idPedido}"
    style="
      padding:10px;
      border-radius:8px;
      background:#2a2a32;
      color:white;
      border:none;
    ">

    <option value="Pendente"
      ${p.status === "Pendente" ? "selected" : ""}>
      Pendente
    </option>

    <option value="Em preparo"
      ${p.status === "Em preparo" ? "selected" : ""}>
      Em preparo
    </option>

    <option value="Saiu para entrega"
      ${p.status === "Saiu para entrega" ? "selected" : ""}>
      Saiu para entrega
    </option>

    <option value="Entregue"
      ${p.status === "Entregue" ? "selected" : ""}>
      Entregue
    </option>

    <option value="Cancelado"
      ${p.status === "Cancelado" ? "selected" : ""}>
      Cancelado
    </option>

  </select>

  <button class="btn-primary"
    onclick="alterarStatus('${p.idPedido}')">
    Salvar
  </button>
</div>
        </div>`;
    });

    document.getElementById("pedidos").innerHTML = html || "<p>Nenhum pedido encontrado.</p>";
  } catch (e) {
    document.getElementById("pedidos").innerHTML = "<p>Erro ao carregar pedidos.</p>";
  }
}

// ==================== CANCELADOS ====================
async function carregarCancelados() {
  try {
    const res = await fetch(API + "?pedidos=1");
    const pedidos = await res.json();
    const cancelados = pedidos.filter(p => p.status === "Cancelado");
    let html = "";

    cancelados.forEach(p => {
      html += `
        <div class="card" style="border-left: 5px solid var(--red);">
          <strong style="color:var(--red)">Pedido #${p.idPedido} (Cancelado)</strong><br><br>
          👤 ${p.cliente}<br>
          📞 ${p.telefone}<br><br>
          💰 R$ ${parseFloat(p.total||0).toFixed(2)}
        </div>`;
    });

    document.getElementById("cancelados").innerHTML = html || "<p>Nenhum pedido cancelado.</p>";
  } catch (e) {
    document.getElementById("cancelados").innerHTML = "<p>Erro ao carregar.</p>";
  }
}

// ==================== PRODUTOS ====================
async function carregarProdutos() {
  try {
    const res = await fetch(API + "?produtos=1");
    const produtos = await res.json();

    let html = `<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:20px;">`;

    produtos.forEach(p => {
      html += `
        <div class="card" style="text-align:center;">
          <img src="${p.imagem || 'https://placehold.co/600x400'}" style="width:100%; height:180px; object-fit:cover; border-radius:12px;">
          <h3 style="margin:12px 0 8px;">${p.nome}</h3>
          <h2 style="color:var(--green);">R$ ${parseFloat(p.preco).toFixed(2)}</h2>
          <p>${p.categoria || ""}</p>
          <div style="margin-top:12px;">
            <button class="btn-primary" onclick="editarProduto('${p.id}')">✏️ Editar</button>
            <button class="btn-danger" onclick="excluirProduto('${p.id}')">🗑 Excluir</button>
          </div>
        </div>`;
    });

    html += `</div>`;
    document.getElementById("listaProdutos").innerHTML = html || "<p>Nenhum produto cadastrado.</p>";
  } catch (e) {
    document.getElementById("listaProdutos").innerHTML = "<p>Erro ao carregar produtos.</p>";
  }
}

// ==================== MODAL PRODUTO ====================
function novoProduto() {
  produtoEditando = null;
  document.getElementById("modalTitulo").textContent = "Novo Produto";
  document.getElementById("prodNome").value = "";
  document.getElementById("prodPreco").value = "";
  document.getElementById("prodCategoria").value = "";
  document.getElementById("prodImagem").value = "";
  document.getElementById("modalProduto").style.display = "flex";
}

function editarProduto(id) {
  produtoEditando = id;
  document.getElementById("modalTitulo").textContent = "Editar Produto";
  document.getElementById("modalProduto").style.display = "flex";
}

function fecharModal() {
  document.getElementById("modalProduto").style.display = "none";
}

async function salvarModal() {
  const nome = document.getElementById("prodNome").value.trim();
  const preco = document.getElementById("prodPreco").value;
  const categoria = document.getElementById("prodCategoria").value.trim();
  const imagem = document.getElementById("prodImagem").value.trim();

  if (!nome || !preco) {
    alert("Nome e Preço são obrigatórios!");
    return;
  }

  const dados = {
    acao: "salvarProduto",
    id: produtoEditando,
    nome: nome,
    preco: preco,
    categoria: categoria,
    imagem: imagem || "https://placehold.co/600x400"
  };

  const resultado = await fazerRequisicao(dados);
  if (resultado.success) {
    alert("✅ Produto salvo com sucesso!");
    fecharModal();
    carregarProdutos();
  } else {
    alert("❌ Erro ao salvar produto");
  }
}

async function excluirProduto(id) {
  if (!confirm("Tem certeza que deseja excluir este produto?")) return;
  
  const resultado = await fazerRequisicao({ acao: "excluirProduto", id: id });
  if (resultado.success) {
    alert("🗑 Produto excluído!");
    carregarProdutos();
  } else {
    alert("❌ Erro ao excluir produto");
  }
}

// Auto login
if (localStorage.getItem("adminLogado")) {
  mostrarPainel();
}

// ==================== ALTERAR STATUS ====================
async function alterarStatus(idPedido) {

  const novoStatus =
    document.getElementById(`status-${idPedido}`).value;

  const resultado = await fazerRequisicao({
    acao: "alterarStatus",
    idPedido: idPedido,
    status: novoStatus
  });

  if (resultado.success) {

    alert("✅ Status atualizado!");

    carregarPedidos();
    carregarDashboard();

  } else {

    alert("❌ Erro ao atualizar status");

  }
}

</script>
</body>
</html>
