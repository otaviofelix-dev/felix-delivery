<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin</title>
  <style>
    :root {
      --bg: #0f0f12;
      --card: #1a1a20;
      --text: #e0e0e0;
      --accent: #00d4ff;
      --green: #00ff9d;
      --red: #ff3b5c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    h2 {
      color: white;
      margin-bottom: 20px;
      font-weight: 600;
    }

    /* Cards Modernos */
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      margin: 15px 0;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      border: 1px solid #2a2a32;
      transition: all 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0, 212, 255, 0.1);
    }

    /* Inputs */
    input, select {
      background: #25252e;
      border: 1px solid #3a3a45;
      color: white;
      padding: 12px 14px;
      border-radius: 10px;
      width: 100%;
      margin: 8px 0;
      font-size: 15px;
      transition: 0.3s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.2);
    }

    /* Botões */
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin: 5px 5px 5px 0;
    }

    button:hover {
      transform: translateY(-2px);
    }

    /* Botão Principal */
    .btn-primary {
      background: var(--accent);
      color: #000;
      font-weight: bold;
    }

    .btn-primary:hover {
      background: #00ffcc;
    }

    /* Botão Vermelho */
    .btn-danger {
      background: var(--red);
      color: white;
    }

    /* Preview */
    .preview {
      max-width: 180px;
      max-height: 180px;
      border-radius: 12px;
      margin: 12px 0;
      border: 2px solid #2a2a32;
    }

    /* Login */
    #login {
      max-width: 380px;
      margin: 80px auto;
      background: var(--card);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    #login h2 {
      margin-bottom: 25px;
      color: var(--accent);
    }
  </style>
</head>
<body>

<div class="container">

  <!-- LOGIN -->
  <div id="login">
    <h2>🔑 Painel Administrativo</h2>
    <input type="text" id="usuario" placeholder="Usuário" value="admin"><br>
    <input type="password" id="senha" placeholder="Senha" value="123"><br><br>
    <button class="btn-primary" onclick="entrar()" style="width:100%; padding:14px;">Entrar</button>
  </div>

  <!-- PAINEL -->
  <div id="painel" style="display:none;">
    <h2>🛠️ Dashboard</h2>
    <button class="btn-primary" onclick="abrirPedidos()">📋 Pedidos</button>
    <button class="btn-primary" onclick="abrirProdutos()">📦 Produtos</button>
    <button onclick="logout()" style="background:#333; color:white;">Sair</button>

    <div id="pedidos"></div>
  </div>

  <!-- PRODUTOS -->
  <div id="produtos" style="display:none;">
    <h2>📦 Gerenciar Produtos</h2>
    <button class="btn-primary" onclick="novoProduto()">+ Novo Produto</button>
    <div id="listaProdutos"></div>
  </div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyXs2d5dDCVGVsiAikISB7fjnkF37iD6---OYh1sPgrRTRtpdtMSJnIJmBBLDRN0NyPhw/exec";

// ==================== LOGIN ====================
function entrar() {
  const usuario = document.getElementById("usuario").value.trim();
  const senha = document.getElementById("senha").value.trim();

  if (usuario === "admin" && senha === "123") {
    localStorage.setItem("adminLogado", "sim");
    mostrarPainel();
  } else {
    alert("Login inválido!");
  }
}

function mostrarPainel() {
  document.getElementById("login").style.display = "none";
  document.getElementById("painel").style.display = "block";
  carregarPedidos();
}

function logout() {
  localStorage.removeItem("adminLogado");
  location.reload();
}

// ==================== ABAS ====================
function abrirPedidos() {
  document.getElementById("painel").style.display = "block";
  document.getElementById("produtos").style.display = "none";
  carregarPedidos();
}

function abrirProdutos() {
  document.getElementById("painel").style.display = "none";
  document.getElementById("produtos").style.display = "block";
  carregarProdutos();
}

// ==================== PEDIDOS ====================
async function carregarPedidos() {
  try {
    const res = await fetch(API + "?pedidos=1");
    const pedidos = await res.json();

    let html = "";
    pedidos.reverse();

    pedidos.forEach(p => {
      html += `
      <div class="card">
        <strong style="color:var(--accent); font-size:18px;">Pedido #${p.idPedido}</strong><br><br>
        👤 ${p.cliente}<br>
        📞 ${p.telefone}<br>
        📍 ${p.endereco}<br>
        🏠 ${p.referencia || '—'}<br>
        💳 ${p.pagamento}<br><br>
        🍔 ${p.itens}<br><br>
        💰 <strong style="color:var(--green); font-size:18px;">R$ ${parseFloat(p.total).toFixed(2)}</strong><br><br>

        <select onchange="atualizarStatus(${p.idPedido}, this.value)" style="background:#25252e; color:white; padding:12px;">
          <option value="Pendente" ${p.status === "Pendente" ? "selected" : ""}>Pendente</option>
          <option value="Em preparo" ${p.status === "Em preparo" ? "selected" : ""}>Em preparo</option>
          <option value="Saiu para entrega" ${p.status === "Saiu para entrega" ? "selected" : ""}>Saiu para entrega</option>
          <option value="Entregue" ${p.status === "Entregue" ? "selected" : ""}>Entregue</option>
        </select>
      </div>`;
    });

    document.getElementById("pedidos").innerHTML = html || "<p style='text-align:center; padding:30px;'>Nenhum pedido no momento.</p>";

  } catch (e) {
    console.error(e);
    document.getElementById("pedidos").innerHTML = "<p style='color:red; text-align:center;'>Erro ao carregar pedidos.</p>";
  }
}

async function atualizarStatus(idPedido, status) {
  try {
    await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ acao: "atualizarStatus", idPedido, status })
    });
  } catch (e) {
    console.error(e);
  }
}

// ==================== PRODUTOS ====================
async function carregarProdutos() {
  try {
    const res = await fetch(API + "?produtos=1");
    const produtos = await res.json();

    let html = "";
    produtos.forEach((p, i) => {
      html += `
      <div class="card">
        <input id="nome${i}" value="${p.nome || ''}" placeholder="Nome do produto">
        <input id="categoria${i}" value="${p.categoria || ''}" placeholder="Categoria">
        <input id="descricao${i}" value="${p.descricao || ''}" placeholder="Descrição">
        <input id="preco${i}" value="${p.preco || ''}" type="number" step="0.01" placeholder="Preço">
        <input id="imagem${i}" value="${p.imagem || ''}" placeholder="URL da Imagem" oninput="previewImagem(${i})">

        <img id="preview${i}" class="preview" src="${p.imagem || ''}"><br>

        <button class="btn-primary" onclick="salvarProduto(${i})">💾 Salvar</button>
        <button class="btn-danger" onclick="apagarProduto(${i})">🗑️ Apagar</button>
      </div>`;
    });

    document.getElementById("listaProdutos").innerHTML = html || "<p style='text-align:center; padding:30px;'>Nenhum produto cadastrado.</p>";

  } catch (e) {
    console.error(e);
  }
}

async function novoProduto() {
  if (!confirm("Criar novo produto?")) return;
  try {
    await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ acao: "novoProduto" })
    });
    alert("✅ Produto criado com sucesso!");
    carregarProdutos();
  } catch (e) {
    alert("Erro ao criar produto");
  }
}

function previewImagem(i) {
  const url = document.getElementById("imagem" + i).value;
  document.getElementById("preview" + i).src = url;
}

async function salvarProduto(i) {
  try {
    await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        acao: "salvarProduto",
        index: i,
        nome: document.getElementById("nome" + i).value,
        categoria: document.getElementById("categoria" + i).value,
        descricao: document.getElementById("descricao" + i).value,
        preco: document.getElementById("preco" + i).value,
        imagem: document.getElementById("imagem" + i).value
      })
    });
    alert("✅ Produto salvo!");
  } catch (e) {
    alert("Erro ao salvar");
  }
}

async function apagarProduto(i) {
  if (!confirm("Apagar este produto permanentemente?")) return;
  try {
    await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ acao: "apagarProduto", index: i })
    });
    alert("🗑️ Produto apagado!");
    carregarProdutos();
  } catch (e) {
    alert("Erro ao apagar");
  }
}

// ==================== INIT ====================
if (localStorage.getItem("adminLogado")) {
  mostrarPainel();
}

setInterval(carregarPedidos, 7000);
</script>

</body>
</html>
