<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin</title>
  <style>
    :root {
      --bg: #0f0f12;
      --card: #1a1a20;
      --text: #e0e0e0;
      --accent: #00d4ff;
      --green: #00ff9d;
      --red: #ff3b5c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.6;
    }

    .container { max-width: 1200px; margin: auto; }

    h2 { color: white; margin: 20px 0; }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      margin: 15px 0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      border: 1px solid #2a2a32;
    }

    input, select {
      background: #25252e;
      border: 1px solid #3a3a45;
      color: white;
      padding: 12px;
      border-radius: 10px;
      width: 100%;
      margin: 8px 0;
      font-size: 15px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      margin: 5px 5px 5px 0;
      transition: 0.3s;
    }

    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { background: #00ffcc; }
    .btn-danger { background: var(--red); color: white; }

    .preview {
      max-width: 180px;
      max-height: 180px;
      border-radius: 12px;
      margin: 10px 0;
      border: 2px solid #333;
    }

    #login {
      max-width: 400px;
      margin: 100px auto;
      background: var(--card);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- LOGIN -->
  <div id="login">
    <h2>🔑 Painel Administrativo</h2>
    <input type="text" id="usuario" placeholder="Usuário" value="admin"><br><br>
    <input type="password" id="senha" placeholder="Senha" value="123"><br><br>
    <button class="btn-primary" onclick="entrar()" style="width:100%; padding:14px;">Entrar</button>
  </div>

  <!-- PAINEL -->
  <div id="painel" style="display:none;">
    <h2>🛠️ Dashboard</h2>
    <button class="btn-primary" onclick="abrirPedidos()">📋 Pedidos</button>
    <button class="btn-primary" onclick="abrirProdutos()">📦 Produtos</button>
    <button onclick="logout()" style="background:#333; color:white;">Sair</button>

    <div id="pedidos"></div>
  </div>

  <!-- PRODUTOS -->
  <div id="produtos" style="display:none;">
    <h2>📦 Gerenciar Produtos</h2>
    <button class="btn-primary" onclick="novoProduto()">+ Novo Produto</button>
    <div id="listaProdutos"></div>
  </div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyXs2d5dDCVGVsiAikISB7fjnkF37iD6---OYh1sPgrRTRtpdtMSJnIJmBBLDRN0NyPhw/exec";

// Função auxiliar (melhor compatibilidade com file://)
async function fazerRequisicao(dados) {
  try {
    await fetch(API, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(dados)
    });
    return true;
  } catch (e) {
    console.error(e);
    return false;
  }
}

// ==================== LOGIN ====================
function entrar() {
  const usuario = document.getElementById("usuario").value.trim();
  const senha = document.getElementById("senha").value.trim();

  if (usuario === "admin" && senha === "123") {
    localStorage.setItem("adminLogado", "sim");
    mostrarPainel();
  } else {
    alert("Login inválido!");
  }
}

function mostrarPainel() {
  document.getElementById("login").style.display = "none";
  document.getElementById("painel").style.display = "block";
  carregarPedidos();
}

function logout() {
  localStorage.removeItem("adminLogado");
  location.reload();
}

// ==================== ABAS ====================
function abrirPedidos() {
  document.getElementById("painel").style.display = "block";
  document.getElementById("produtos").style.display = "none";
  carregarPedidos();
}

function abrirProdutos() {
  document.getElementById("painel").style.display = "none";
  document.getElementById("produtos").style.display = "block";
  carregarProdutos();
}

// ==================== PEDIDOS ====================
async function carregarPedidos() {
  try {
    const res = await fetch(API + "?pedidos=1");
    const pedidos = await res.json();

    let html = "";
    pedidos.reverse();

    pedidos.forEach(p => {
      html += `
      <div class="card">
        <strong style="color:var(--accent); font-size:18px;">Pedido #${p.idPedido}</strong><br><br>
        👤 ${p.cliente}<br>
        📞 ${p.telefone}<br>
        📍 ${p.endereco}<br>
        🏠 ${p.referencia || '—'}<br>
        💳 ${p.pagamento}<br><br>
        🍔 ${p.itens}<br><br>
        💰 <strong style="color:var(--green); font-size:18px;">R$ ${parseFloat(p.total).toFixed(2)}</strong><br><br>

        <select onchange="atualizarStatus(${p.idPedido}, this.value)">
          <option value="Pendente" ${p.status === "Pendente" ? "selected" : ""}>Pendente</option>
          <option value="Em preparo" ${p.status === "Em preparo" ? "selected" : ""}>Em preparo</option>
          <option value="Saiu para entrega" ${p.status === "Saiu para entrega" ? "selected" : ""}>Saiu para entrega</option>
          <option value="Entregue" ${p.status === "Entregue" ? "selected" : ""}>Entregue</option>
        </select>
      </div>`;
    });

    document.getElementById("pedidos").innerHTML = html || "<p>Nenhum pedido encontrado.</p>";
  } catch (e) {
    document.getElementById("pedidos").innerHTML = "<p style='color:orange'>Não foi possível carregar os pedidos.</p>";
  }
}

async function atualizarStatus(idPedido, status) {
  fazerRequisicao({ acao: "atualizarStatus", idPedido, status });
}

// ==================== PRODUTOS ====================
async function carregarProdutos() {
  try {
    const res = await fetch(API + "?produtos=1");
    const produtos = await res.json();

    let html = "";
    produtos.forEach((p, i) => {
      html += `
      <div class="card">
        <input id="nome${i}" value="${p.nome || ''}" placeholder="Nome do produto">
        <input id="categoria${i}" value="${p.categoria || ''}" placeholder="Categoria">
        <input id="descricao${i}" value="${p.descricao || ''}" placeholder="Descrição">
        <input id="preco${i}" value="${p.preco || ''}" type="number" step="0.01" placeholder="Preço">
        <input id="imagem${i}" value="${p.imagem || ''}" placeholder="URL da Imagem" oninput="previewImagem(${i})">

        <img id="preview${i}" class="preview" src="${p.imagem || ''}"><br>

        <button class="btn-primary" onclick="salvarProduto(${i})">💾 Salvar</button>
        <button class="btn-danger" onclick="apagarProduto(${i})">🗑️ Apagar</button>
      </div>`;
    });

    document.getElementById("listaProdutos").innerHTML = html || "<p>Nenhum produto cadastrado.</p>";
  } catch (e) {
    document.getElementById("listaProdutos").innerHTML = "<p style='color:orange'>Erro ao carregar produtos.</p>";
  }
}

async function novoProduto() {
  if (!confirm("Criar novo produto?")) return;
  
  await fazerRequisicao({ acao: "novoProduto" });
  alert("✅ Produto criado! Atualizando lista...");
  carregarProdutos();
}

function previewImagem(i) {
  const url = document.getElementById("imagem" + i).value;
  document.getElementById("preview" + i).src = url;
}

async function salvarProduto(i) {
  await fazerRequisicao({
    acao: "salvarProduto",
    index: i,
    nome: document.getElementById("nome" + i).value,
    categoria: document.getElementById("categoria" + i).value,
    descricao: document.getElementById("descricao" + i).value,
    preco: document.getElementById("preco" + i).value,
    imagem: document.getElementById("imagem" + i).value
  });
  alert("✅ Produto salvo!");
}

async function apagarProduto(i) {
  if (!confirm("Apagar este produto?")) return;
  await fazerRequisicao({ acao: "apagarProduto", index: i });
  alert("🗑️ Produto apagado!");
  carregarProdutos();
}

// ==================== INICIALIZAÇÃO ====================
if (localStorage.getItem("adminLogado")) {
  mostrarPainel();
}

// Atualiza pedidos a cada 8 segundos
setInterval(carregarPedidos, 8000);
</script>

</body>
</html>
