<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Restaurante</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0f0f0f;
  color:white;
  font-family:Arial,sans-serif;
  min-height:100vh;
}

/* LOGIN */

.login{
  width:100%;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  width:100%;
  max-width:400px;
  background:#1b1b1b;
  padding:30px;
  border-radius:24px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

h1{
  margin-bottom:25px;
  text-align:center;
}

input{
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  background:#2a2a2a;
  color:white;
  margin-bottom:15px;
  font-size:16px;
}

button{
  width:100%;
  border:none;
  background:#00c853;
  color:white;
  padding:16px;
  border-radius:14px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  opacity:0.9;
}

/* PAINEL */

#painel{
  display:none;
  padding:20px;
}

#produtos{
  display:none;
  padding:20px;
}

.topo{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.sair{
  width:auto;
  padding:12px 18px;
  background:#c62828;
}

/* ABAS */

.abas{
  display:flex;
  gap:10px;
  margin-bottom:25px;
}

.abas button{
  width:auto;
  padding:12px 20px;
}

/* PEDIDOS */

#pedidos{
  display:flex;
  flex-direction:column;
  gap:20px;
}

.card{
  background:#1b1b1b;
  border-radius:22px;
  padding:20px;
  box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

.id{
  color:#00e676;
  font-size:20px;
  font-weight:bold;
}

.info{
  margin-top:12px;
  line-height:1.7;
  color:#ddd;
}

.status{
  margin-top:16px;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#2a2a2a;
  color:white;
  width:100%;
}

.produtoInput{
  margin-bottom:12px;
}

.preview{
  width:100%;
  max-height:220px;
  object-fit:cover;
  border-radius:14px;
  margin-top:10px;
  margin-bottom:15px;
  background:#222;
}

</style>

</head>

<body>

<!-- LOGIN -->

<div class="login" id="login">

  <div class="box">

    <h1>
      🍔 Restaurante
    </h1>

    <input
      type="text"
      id="usuario"
      placeholder="Usuário"
    >

    <input
      type="password"
      id="senha"
      placeholder="Senha"
    >

    <button onclick="entrar()">
      Entrar
    </button>

  </div>

</div>

<!-- PAINEL -->

<div id="painel">

  <div class="topo">

    <h1>
      📦 Painel Restaurante
    </h1>

    <button
      class="sair"
      onclick="logout()"
    >
      Sair
    </button>

  </div>

  <!-- ABAS -->

  <div class="abas">

    <button onclick="abrirPedidos()">
      📦 Pedidos
    </button>

    <button onclick="abrirProdutos()">
      🍔 Produtos
    </button>

  </div>

  <!-- PEDIDOS -->

  <div id="pedidos">

    Carregando...

  </div>

</div>

<!-- PRODUTOS -->

<div id="produtos">

  <h1>
    🍔 Produtos
  </h1>

  <br>

  <button onclick="novoProduto()">

    ➕ Adicionar Produto

  </button>

  <br><br>

  <div id="listaProdutos">

    Carregando...

  </div>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbwYec4nNNscraZl1PlaeQ0DDyqNPdjvZYPGYncWPLCVH5V51hGBXJGrXX1BLak4WgJMKA/exec";

/* LOGIN */

function entrar(){

  const usuario =
  document.getElementById("usuario").value;

  const senha =
  document.getElementById("senha").value;

  if(
    usuario === "admin"
    &&
    senha === "123"
  ){

    localStorage.setItem(
      "adminLogado",
      "sim"
    );

    mostrarPainel();

  }else{

    alert("Login inválido");

  }

}

/* MOSTRAR PAINEL */

function mostrarPainel(){

  document.getElementById("login")
  .style.display = "none";

  document.getElementById("painel")
  .style.display = "block";

  carregarPedidos();

}

/* LOGOUT */

function logout(){

  localStorage.removeItem(
    "adminLogado"
  );

  location.reload();

}

/* ABAS */

function abrirPedidos(){

  document.getElementById("painel")
  .style.display = "block";

  document.getElementById("produtos")
  .style.display = "none";

}

function abrirProdutos(){

  document.getElementById("painel")
  .style.display = "none";

  document.getElementById("produtos")
  .style.display = "block";

  carregarProdutos();

}

/* PEDIDOS */

async function carregarPedidos(){

  try{

    const resposta =
    await fetch(API + "?pedidos=1");

    const pedidos =
    await resposta.json();

    let html = "";

    pedidos.reverse();

    pedidos.forEach(p => {

      html += `

      <div class="card">

        <div class="id">

          Pedido #${p.idPedido}

        </div>

        <div class="info">

          👤 ${p.cliente}
          <br>

          📞 ${p.telefone}
          <br>

          📍 ${p.endereco}
          <br>

          🏠 ${p.referencia}
          <br>

          💳 ${p.pagamento}
          <br><br>

          🍔 ${p.itens}
          <br><br>

          💰 R$ ${p.total}

        </div>

        <select class="status">

          <option>
            ${p.status}
          </option>

          <option>
            Pendente
          </option>

          <option>
            Em preparo
          </option>

          <option>
            Saiu para entrega
          </option>

          <option>
            Entregue
          </option>

        </select>

      </div>

      `;

    });

    document.getElementById("pedidos")
    .innerHTML = html;

  }catch(erro){

    console.log(erro);

  }

}

/* PRODUTOS */

async function carregarProdutos(){

  try{

    const resposta =
    await fetch(API + "?produtos=1");

    const produtos =
    await resposta.json();

    let html = "";

    produtos.forEach((p,i)=>{

      html += `

      <div class="card">

        <input
          class="produtoInput"
          id="nome${i}"
          value="${p.nome}"
          placeholder="Nome"
        >

        <input
          class="produtoInput"
          id="categoria${i}"
          value="${p.categoria}"
          placeholder="Categoria"
        >

        <input
          class="produtoInput"
          id="descricao${i}"
          value="${p.descricao}"
          placeholder="Descrição"
        >

        <input
          class="produtoInput"
          id="preco${i}"
          value="${p.preco}"
          placeholder="Preço"
        >

        <input
          class="produtoInput"
          id="imagem${i}"
          value="${p.imagem}"
          placeholder="URL da imagem"
          oninput="previewImagem(${i})"
        >

        <img
          id="preview${i}"
          class="preview"
          src="${p.imagem}"
        >

        <button onclick="salvarProduto(${i})">

          💾 Salvar Produto

        </button>

      </div>

      <br>

      `;

    });

    document.getElementById("listaProdutos")
    .innerHTML = html;

  }catch(erro){

    console.log(erro);

  }

}

/* NOVO PRODUTO */

async function novoProduto(){

  try{

    const resposta =
    await fetch(API,{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({

        acao:"novoProduto"

      })

    });

    const texto =
    await resposta.text();

    console.log(texto);

    alert("Produto criado!");

    carregarProdutos();

  }catch(erro){

    alert("Erro ao adicionar produto");

    console.log(erro);

  }

}

/* SALVAR */

async function salvarProduto(i){

  const nome =
  document.getElementById("nome"+i).value;

  const categoria =
  document.getElementById("categoria"+i).value;

  const descricao =
  document.getElementById("descricao"+i).value;

  const preco =
  document.getElementById("preco"+i).value;

  const imagem =
  document.getElementById("imagem"+i).value;

  await fetch(API,{

    method:"POST",

    body:JSON.stringify({

      acao:"salvarProduto",

      index:i,

      nome,
      categoria,
      descricao,
      preco,
      imagem

    })

  });

  alert("Produto salvo!");

}

/* LOGIN AUTO */

if(
  localStorage.getItem("adminLogado")
){
  mostrarPainel();
}

/* AUTO ATUALIZAR */

setInterval(
  carregarPedidos,
  5000
);

</script>

</body>

</html>
