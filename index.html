<script>

const API =
"https://script.google.com/macros/s/AKfycbyXs2d5dDCVGVsiAikISB7fjnkF37iD6---OYh1sPgrRTRtpdtMSJnIJmBBLDRN0NyPhw/exec";

/* LOGIN */

function entrar(){

  const usuario =
  document.getElementById("usuario").value;

  const senha =
  document.getElementById("senha").value;

  if(
    usuario === "admin"
    &&
    senha === "123"
  ){

    localStorage.setItem(
      "adminLogado",
      "sim"
    );

    mostrarPainel();

  }else{

    alert("Login inválido");

  }

}

/* MOSTRAR PAINEL */

function mostrarPainel(){

  document.getElementById("login")
  .style.display = "none";

  document.getElementById("painel")
  .style.display = "block";

  carregarPedidos();

}

/* LOGOUT */

function logout(){

  localStorage.removeItem(
    "adminLogado"
  );

  location.reload();

}

/* ABAS */

function abrirPedidos(){

  document.getElementById("painel")
  .style.display = "block";

  document.getElementById("produtos")
  .style.display = "none";

}

function abrirProdutos(){

  document.getElementById("painel")
  .style.display = "none";

  document.getElementById("produtos")
  .style.display = "block";

  carregarProdutos();

}

/* PEDIDOS */

async function carregarPedidos(){

  try{

    const resposta =
    await fetch(API + "?pedidos=1");

    const pedidos =
    await resposta.json();

    let html = "";

    pedidos.reverse();

    pedidos.forEach(p => {

      html += `

      <div class="card">

        <div class="id">

          Pedido #${p.idPedido}

        </div>

        <div class="info">

          👤 ${p.cliente}
          <br>

          📞 ${p.telefone}
          <br>

          📍 ${p.endereco}
          <br>

          🏠 ${p.referencia}
          <br>

          💳 ${p.pagamento}
          <br><br>

          🍔 ${p.itens}
          <br><br>

          💰 R$ ${p.total}

        </div>

        <select class="status">

          <option>
            ${p.status}
          </option>

          <option>
            Pendente
          </option>

          <option>
            Em preparo
          </option>

          <option>
            Saiu para entrega
          </option>

          <option>
            Entregue
          </option>

        </select>

      </div>

      `;

    });

    document.getElementById("pedidos")
    .innerHTML = html;

  }catch(erro){

    console.log(erro);

  }

}

/* PRODUTOS */

async function carregarProdutos(){

  try{

    const resposta =
    await fetch(API + "?produtos=1");

    const produtos =
    await resposta.json();

    let html = "";

    produtos.forEach((p,i)=>{

      html += `

      <div class="card">

        <input
          class="produtoInput"
          id="nome${i}"
          value="${p.nome}"
          placeholder="Nome"
        >

        <input
          class="produtoInput"
          id="categoria${i}"
          value="${p.categoria}"
          placeholder="Categoria"
        >

        <input
          class="produtoInput"
          id="descricao${i}"
          value="${p.descricao}"
          placeholder="Descrição"
        >

        <input
          class="produtoInput"
          id="preco${i}"
          value="${p.preco}"
          placeholder="Preço"
        >

        <input
          class="produtoInput"
          id="imagem${i}"
          value="${p.imagem}"
          placeholder="URL da imagem"
          oninput="previewImagem(${i})"
        >

        <img
          id="preview${i}"
          class="preview"
          src="${p.imagem}"
        >

        <button onclick="salvarProduto(${i})">

          💾 Salvar Produto

        </button>

        <br><br>

        <button
          onclick="apagarProduto(${i})"
          style="background:#c62828;"
        >

          🗑️ Apagar Produto

        </button>

      </div>

      <br>

      `;

    });

    document.getElementById("listaProdutos")
    .innerHTML = html;

  }catch(erro){

    console.log(erro);

  }

}

/* NOVO PRODUTO */

async function novoProduto(){

  try{

    const resposta =
    await fetch(API,{

      method:"POST",

      body:JSON.stringify({

        acao:"novoProduto"

      })

    });

    const texto =
    await resposta.text();

    console.log(texto);

    alert("Produto criado!");

    carregarProdutos();

  }catch(erro){

    alert("Erro ao adicionar produto");

    console.log(erro);

  }

}

/* PREVIEW */

function previewImagem(i){

  const url =
  document.getElementById("imagem"+i).value;

  document.getElementById("preview"+i)
  .src = url;

}

/* SALVAR */

async function salvarProduto(i){

  const nome =
  document.getElementById("nome"+i).value;

  const categoria =
  document.getElementById("categoria"+i).value;

  const descricao =
  document.getElementById("descricao"+i).value;

  const preco =
  document.getElementById("preco"+i).value;

  const imagem =
  document.getElementById("imagem"+i).value;

  await fetch(API,{

    method:"POST",

    body:JSON.stringify({

      acao:"salvarProduto",

      index:i,

      nome,
      categoria,
      descricao,
      preco,
      imagem

    })

  });

  alert("Produto salvo!");

}

/* APAGAR PRODUTO */

async function apagarProduto(i){

  const confirmar =
  confirm("Deseja apagar este produto?");

  if(!confirmar){
    return;
  }

  try{

    await fetch(API,{

      method:"POST",

      body:JSON.stringify({

        acao:"apagarProduto",

        index:i

      })

    });

    alert("Produto apagado!");

    carregarProdutos();

  }catch(erro){

    alert("Erro ao apagar produto");

    console.log(erro);

  }

}

/* LOGIN AUTO */

if(
  localStorage.getItem("adminLogado")
){
  mostrarPainel();
}

/* AUTO ATUALIZAR */

setInterval(
  carregarPedidos,
  5000
);

</script>

</body> 

</html>
