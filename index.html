<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - Felix Delivery</title>
  <style>
    :root {
      --bg: #0f0f12;
      --card: #1a1a20;
      --accent: #00d4ff;
      --green: #00ff9d;
      --red: #ff3b5c;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      color: #e0e0e0;
      padding: 15px;
    }
    .container { max-width: 1200px; margin: auto; }

    header {
      background: linear-gradient(135deg, #1a1a20, #25252e);
      padding: 18px 25px;
      border-radius: 16px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      margin: 15px 0;
      border: 1px solid #2a2a32;
    }

    button {
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      margin: 6px 8px 6px 0;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-danger { background: var(--red); color: white; }
    .btn-back { background: #333; color: white; }
  </style>
</head>
<body>

<div class="container">

  <header>
    <h2>🔧 Painel Admin - Felix Delivery</h2>
    <button onclick="logout()" style="background:#c62828;">Sair</button>
  </header>

  <!-- LOGIN -->
  <div id="login">
    <h2>🔑 Login Administrativo</h2>
    <input type="text" id="usuario" placeholder="Usuário" value="admin"><br><br>
    <input type="password" id="senha" placeholder="Senha" value="123"><br><br>
    <button class="btn-primary" onclick="entrar()" style="width:100%; padding:16px;">Entrar</button>
  </div>

  <!-- DASHBOARD -->
  <div id="painel" style="display:none;">
    <h2>Dashboard</h2>
    <div style="margin: 20px 0;">
      <button class="btn-primary" onclick="abrirPedidos()">📋 Todos os Pedidos</button>
      <button class="btn-primary" onclick="abrirCancelados()">❌ Pedidos Cancelados</button>
      <button class="btn-primary" onclick="abrirProdutos()">📦 Gerenciar Produtos</button>
    </div>

    <div class="summary" style="display:flex; gap:20px; flex-wrap:wrap;">
      <div class="summary-card" style="flex:1; background:var(--card); padding:20px; border-radius:12px; text-align:center;">
        <h3>Total de Pedidos</h3>
        <h1 id="total-pedidos" style="color:var(--accent); font-size:42px;">0</h1>
      </div>
      <div class="summary-card" style="flex:1; background:var(--card); padding:20px; border-radius:12px; text-align:center;">
        <h3>Valor Total</h3>
        <h1 id="valor-total" style="color:var(--green); font-size:42px;">R$ 0,00</h1>
      </div>
    </div>
  </div>

  <!-- TODOS OS PEDIDOS -->
  <div id="pedidos-section" style="display:none;">
    <button class="btn-back" onclick="voltarParaMenu()">← Voltar</button>
    <h2>📋 Todos os Pedidos</h2>
    <div id="pedidos"></div>
  </div>

  <!-- PEDIDOS CANCELADOS -->
  <div id="cancelados-section" style="display:none;">
    <button class="btn-back" onclick="voltarParaMenu()">← Voltar</button>
    <h2>❌ Pedidos Cancelados</h2>
    <div id="cancelados"></div>
  </div>

  <!-- PRODUTOS -->
  <div id="produtos-section" style="display:none;">
    <button class="btn-back" onclick="voltarParaMenu()">← Voltar</button>
    <h2>📦 Gerenciar Produtos</h2>
    <button class="btn-primary" onclick="novoProduto()">+ Novo Produto</button>
    <div id="listaProdutos"></div>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyXs2d5dDCVGVsiAikISB7fjnkF37iD6---OYh1sPgrRTRtpdtMSJnIJmBBLDRN0NyPhw/exec";

async function fazerRequisicao(dados) {
  try {
    await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(dados)
    });
    return true;
  } catch (e) { return false; }
}

// ==================== NAVEGAÇÃO ====================
function entrar() {
  if (document.getElementById("usuario").value === "admin" && document.getElementById("senha").value === "123") {
    localStorage.setItem("adminLogado", "sim");
    mostrarPainel();
  } else alert("Login inválido!");
}

function mostrarPainel() {
  document.getElementById("login").style.display = "none";
  document.getElementById("painel").style.display = "block";
  carregarDashboard();
}

function logout() { localStorage.removeItem("adminLogado"); location.reload(); }
function voltarParaMenu() {
  document.getElementById("pedidos-section").style.display = "none";
  document.getElementById("cancelados-section").style.display = "none";
  document.getElementById("produtos-section").style.display = "none";
  document.getElementById("painel").style.display = "block";
}

function abrirPedidos() {
  document.getElementById("painel").style.display = "none";
  document.getElementById("pedidos-section").style.display = "block";
  carregarPedidos();
}

function abrirCancelados() {
  document.getElementById("painel").style.display = "none";
  document.getElementById("cancelados-section").style.display = "block";
  carregarCancelados();
}

function abrirProdutos() {
  alert("Em desenvolvimento...");
}

// ==================== DASHBOARD ====================
async function carregarDashboard() {
  try {
    const res = await fetch(API + "?pedidos=1");
    const pedidos = await res.json();
    const total = pedidos.length;
    const valor = pedidos.reduce((s, p) => s + parseFloat(p.total || 0), 0);
    document.getElementById("total-pedidos").textContent = total;
    document.getElementById("valor-total").textContent = "R$ " + valor.toFixed(2);
  } catch(e){}
}

// ==================== PEDIDOS ====================
async function carregarPedidos() {
  try {
    const res = await fetch(API + "?pedidos=1");
    const pedidos = await res.json();
    let html = "";
    pedidos.reverse();

    pedidos.forEach(p => {
      html += `
      <div class="card">
        <strong style="color:var(--accent)">Pedido #${p.idPedido}</strong><br><br>
        👤 ${p.cliente} | 📞 ${p.telefone}<br>
        📍 ${p.endereco}<br><br>
        🍔 ${p.itens}<br><br>
        💰 <strong style="color:var(--green)">R$ ${parseFloat(p.total).toFixed(2)}</strong><br><br>
        
        <select onchange="atualizarStatus(${p.idPedido}, this.value)">
          <option value="Pendente" ${p.status === "Pendente" ? "selected" : ""}>Pendente</option>
          <option value="Em preparo" ${p.status === "Em preparo" ? "selected" : ""}>Em preparo</option>
          <option value="Saiu para entrega" ${p.status === "Saiu para entrega" ? "selected" : ""}>Saiu para entrega</option>
          <option value="Entregue" ${p.status === "Entregue" ? "selected" : ""}>Entregue</option>
        </select>
        <button class="btn-danger" onclick="cancelarPedido(${p.idPedido}, '${p.telefone}', '${p.cliente}')">❌ Cancelar Pedido</button>
      </div>`;
    });
    document.getElementById("pedidos").innerHTML = html || "<p>Nenhum pedido ativo.</p>";
  } catch (e) {}
}

// ==================== CANCELADOS ====================
async function carregarCancelados() {
  try {
    const res = await fetch(API + "?pedidos=1");
    const pedidos = await res.json();
    let html = "";
    const cancelados = pedidos.filter(p => p.status === "Cancelado");

    cancelados.forEach(p => {
      html += `
      <div class="card" style="border-left: 5px solid var(--red); opacity:0.9;">
        <strong style="color:var(--red)">Pedido #${p.idPedido} (Cancelado)</strong><br><br>
        👤 ${p.cliente}<br>
        📞 ${p.telefone}<br><br>
        💰 R$ ${parseFloat(p.total).toFixed(2)}
      </div>`;
    });

    document.getElementById("cancelados").innerHTML = html || "<p>Nenhum pedido cancelado.</p>";
  } catch (e) {}
}

// ==================== FUNÇÕES GERAIS ====================
async function atualizarStatus(idPedido, status) {
  await fazerRequisicao({ acao: "atualizarStatus", idPedido, status });
  setTimeout(() => { carregarPedidos(); carregarCancelados(); }, 800);
}

async function cancelarPedido(id, telefone, cliente) {
  if (!confirm(`Cancelar Pedido #${id}?`)) return;

  const motivo = prompt("Motivo do cancelamento:", "Produto indisponível");
  if (!motivo) return;

  await fazerRequisicao({ acao: "atualizarStatus", idPedido: id, status: "Cancelado" });

  const msg = `Olá ${cliente},%0A%0APedimos desculpas, mas o Pedido #${id} foi cancelado.%0AMotivo: ${motivo}.%0A%0ASentimos muito.`;
  const numero = telefone.replace(/\D/g, '');
  window.open(`https://wa.me/${numero}?text=${msg}`, "_blank");

  setTimeout(() => { carregarPedidos(); carregarCancelados(); }, 1000);
}

// Init
if (localStorage.getItem("adminLogado")) mostrarPainel();
</script>
</body>
</html>
