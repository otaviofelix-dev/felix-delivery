<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - Felix Delivery</title>
  <style>
    :root {
      --bg: #0f0f12;
      --card: #1a1a20;
      --accent: #00d4ff;
      --green: #00ff9d;
      --red: #ff3b5c;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      color: #e0e0e0;
      padding: 15px;
    }
    .container { max-width: 1200px; margin: auto; }

    header {
      background: linear-gradient(135deg, #1a1a20, #25252e);
      padding: 18px 25px;
      border-radius: 16px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      margin: 15px 0;
      border: 1px solid #2a2a32;
    }

    button {
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      margin: 6px 8px 6px 0;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-danger { background: var(--red); color: white; }
    .btn-back { background: #333; color: white; }

    /* ==================== LOADING ==================== */
    .loading-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(15,15,18,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      backdrop-filter: blur(4px);
    }

    .spinner {
      width: 70px;
      height: 70px;
      border: 6px solid #2a2a32;
      border-top: 6px solid var(--accent);
      border-radius: 50%;
      animation: girar 0.8s linear infinite;
    }

    @keyframes girar { 100% { transform: rotate(360deg); } }

    /* ==================== KANBAN ==================== */
    .kanban {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
      align-items: start;
    }

    .kanban-coluna {
      background: #16161d;
      border-radius: 18px;
      padding: 12px;
      min-height: 300px;
    }

    .kanban-titulo {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 12px;
      text-align: center;
    }

    .pedido-card {
      background: #1f1f28;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #2a2a32;
      transition: .2s;
      font-size: 13.5px;
    }

    .pedido-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .pedido-info {
      line-height: 1.4;
    }

    .pedido-data {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 8px;
    }

    .pedido-total {
      color: var(--green);
      font-size: 18px;
      font-weight: bold;
      margin-top: 8px;
    }

    .status-select {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      background: #2a2a32;
      color: white;
      border: none;
      margin: 8px 0 6px 0;
      font-size: 13px;
    }

    .btn-status {
      width: 100%;
      padding: 10px;
      font-size: 13px;
    }

    @media (max-width: 768px) {
      .kanban {
        display: flex;
        overflow-x: auto;
        padding-bottom: 10px;
      }
      .kanban-coluna {
        min-width: 280px;
        flex-shrink: 0;
      }
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #1f1f28;
      padding: 25px;
      border-radius: 16px;
      width: 90%;
      max-width: 420px;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: #2a2a32;
      border: none;
      border-radius: 8px;
      color: white;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- LOADING -->
  <div id="loading" class="loading-overlay">
    <div class="spinner"></div>
  </div>

  <header>
    <h2>🔧 Painel Admin - Felix Delivery</h2>
    <button onclick="logout()" style="background:#c62828;">Sair</button>
  </header>

  <!-- LOGIN -->
  <div id="login">
    <h2>🔑 Login Administrativo</h2>
    <input type="text" id="usuario" placeholder="Usuário" value="admin"><br><br>
    <input type="password" id="senha" placeholder="Senha" value="123"><br><br>
    <button class="btn-primary" onclick="entrar()" style="width:100%; padding:16px;">Entrar</button>
  </div>

  <!-- DASHBOARD -->
  <div id="painel" style="display:none;">
    <h2>Dashboard</h2>
    <div style="margin: 20px 0;">
      <button class="btn-primary" onclick="abrirPedidos()">📋 Todos os Pedidos</button>
      <button class="btn-primary" onclick="abrirCancelados()">❌ Pedidos Cancelados</button>
      <button class="btn-primary" onclick="abrirProdutos()">📦 Gerenciar Produtos</button>
      <button class="btn-primary" onclick="abrirConfiguracoes()">⚙️ Configurações</button>
    </div>
    <div style="display:flex; gap:20px; flex-wrap:wrap;">
      <div class="card" style="flex:1; text-align:center;">
        <h3>Total de Pedidos</h3>
        <h1 id="total-pedidos" style="color:var(--accent); font-size:42px;">0</h1>
      </div>
      <div class="card" style="flex:1; text-align:center;">
        <h3>Valor Total</h3>
        <h1 id="valor-total" style="color:var(--green); font-size:42px;">R$ 0,00</h1>
      </div>
    </div>
  </div>

  <!-- TODOS OS PEDIDOS -->
  <div id="pedidos-section" style="display:none;">
    <button class="btn-back" onclick="voltarParaMenu()">← Voltar</button>
    <h2>📋 Todos os Pedidos</h2>
    <div id="pedidos-kanban" class="kanban"></div>
  </div>

  <!-- PEDIDOS CANCELADOS -->
  <div id="cancelados-section" style="display:none;">
    <button class="btn-back" onclick="voltarParaMenu()">← Voltar</button>
    <h2>❌ Pedidos Cancelados</h2>
    <div id="cancelados"></div>
  </div>

  <!-- GERENCIAR PRODUTOS -->
  <div id="produtos-section" style="display:none;">
    <button class="btn-back" onclick="voltarParaMenu()">← Voltar</button>
    <h2>📦 Gerenciar Produtos</h2>
    <button class="btn-primary" onclick="novoProduto()">+ Novo Produto</button>
    <div id="listaProdutos"></div>
  </div>

  <!-- CONFIGURAÇÕES -->
  <div id="config-section" style="display:none;">
    <button class="btn-back" onclick="voltarParaMenu()">← Voltar</button>
    <h2 style="margin-bottom:20px;">⚙️ Configurações da Loja</h2>

    <div class="card">
      <h3>🎨 Personalização</h3>
      <input type="text" id="nomeLoja" placeholder="Nome da Loja">
      <label>Cor principal</label>
      <input type="color" id="corSistema" value="#00d4ff" style="width:100%; height:60px;">
      <input type="text" id="logoLoja" placeholder="URL da Logo">
      <button class="btn-primary" onclick="salvarConfiguracoes()" style="width:100%; margin-top:15px;">
        💾 Salvar Configurações
      </button>
    </div>

    <div class="card">
      <h3>🚚 Delivery</h3>
      <input type="text" id="taxaEntrega" placeholder="Taxa de entrega">
      <input type="text" id="tempoEntrega" placeholder="Tempo médio">
      <input type="text" id="pedidoMinimo" placeholder="Pedido mínimo">
    </div>

    <div class="card">
      <h3>📱 WhatsApp</h3>
      <input type="text" id="whatsappLoja" placeholder="WhatsApp">
      <textarea id="mensagemAuto" placeholder="Mensagem automática" style="min-height:120px;"></textarea>
    </div>

    <div class="card">
      <h3>🟢 Status da Loja</h3>
      <button id="btnLoja" class="btn-primary" onclick="toggleLoja()" style="width:100%; padding:18px; font-size:18px;">
        🟢 Loja Aberta
      </button>
    </div>
  </div>

</div>

<!-- MODAL PARA PRODUTOS -->
<div id="modalProduto" class="modal">
  <div class="modal-content">
    <h3 id="modalTitulo">Novo Produto</h3>
    <input type="text" id="prodNome" placeholder="Nome do produto" required>
    <input type="number" id="prodPreco" placeholder="Preço (ex: 29.90)" step="0.01" required>
    <input type="text" id="prodCategoria" placeholder="Categoria (ex: Lanches, Bebidas)">
    <input type="text" id="prodImagem" placeholder="URL da Imagem">

    <div style="margin-top:20px; display:flex; gap:10px;">
      <button class="btn-primary" onclick="salvarModal()" style="flex:1;">Salvar</button>
      <button class="btn-back" onclick="fecharModal()" style="flex:1;">Cancelar</button>
    </div>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxJrnbC_4yVaXtetK_4Eo1IYJ-Y6CWWCWc7J_QKaW58pA1lwRKXedDIT-1hk0YmLjaUqA/exec";

let produtoEditando = null;

// ==================== LOADING ====================
function mostrarLoading() {
  document.getElementById("loading").style.display = "flex";
}

function esconderLoading() {
  document.getElementById("loading").style.display = "none";
}

// ==================== REQUISIÇÃO ====================
async function fazerRequisicao(dados) {
  try {
    await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(dados),
      mode: "no-cors"
    });
    return { success: true };
  } catch (e) {
    console.error("Erro na requisição:", e);
    return { success: false };
  }
}

// ==================== LOGIN ====================
function entrar() {
  const usuario = document.getElementById("usuario").value;
  const senha = document.getElementById("senha").value;
  if (usuario === "admin" && senha === "123") {
    localStorage.setItem("adminLogado", "sim");
    mostrarPainel();
  } else {
    alert("Login inválido!");
  }
}

function mostrarPainel() {
  document.getElementById("login").style.display = "none";
  document.getElementById("painel").style.display = "block";
  carregarDashboard();
}

function logout() {
  localStorage.removeItem("adminLogado");
  location.reload();
}

function voltarParaMenu() {
  document.getElementById("painel").style.display = "block";
  document.getElementById("pedidos-section").style.display = "none";
  document.getElementById("cancelados-section").style.display = "none";
  document.getElementById("produtos-section").style.display = "none";
  document.getElementById("config-section").style.display = "none";
}

function abrirPedidos() {
  document.getElementById("painel").style.display = "none";
  document.getElementById("pedidos-section").style.display = "block";
  carregarPedidos();
}

function abrirCancelados() {
  document.getElementById("painel").style.display = "none";
  document.getElementById("cancelados-section").style.display = "block";
  carregarCancelados();
}

function abrirProdutos() {
  document.getElementById("painel").style.display = "none";
  document.getElementById("produtos-section").style.display = "block";
  carregarProdutos();
}

function abrirConfiguracoes() {
  document.getElementById("painel").style.display = "none";
  document.getElementById("pedidos-section").style.display = "none";
  document.getElementById("cancelados-section").style.display = "none";
  document.getElementById("produtos-section").style.display = "none";
  document.getElementById("config-section").style.display = "block";
  carregarConfiguracoes();
}

// ==================== DASHBOARD ====================
async function carregarDashboard() {
  mostrarLoading();
  try {
    const res = await fetch(API + "?pedidos=1");
    const pedidos = await res.json();
    const total = pedidos.length;
    const valor = pedidos.reduce((s, p) => s + parseFloat(p.total || 0), 0);
    document.getElementById("total-pedidos").textContent = total;
    document.getElementById("valor-total").textContent = "R$ " + valor.toFixed(2);
  } catch (e) {
    console.log(e);
  } finally {
    esconderLoading();
  }
}

// ==================== PEDIDOS (KANBAN) ====================
async function carregarPedidos() {
  mostrarLoading();
  try {
    const res = await fetch(API + "?pedidos=1");
    const pedidos = await res.json();
    pedidos.reverse();

    const statusLista = [
      { nome: "Pendente", cor: "#ff9800" },
      { nome: "Em preparo", cor: "#00d4ff" },
      { nome: "Saiu para entrega", cor: "#9c27b0" },
      { nome: "Entregue", cor: "#00ff9d" },
      { nome: "Cancelado", cor: "#ff3b5c" }
    ];

    let html = "";

    statusLista.forEach(statusColuna => {
      const pedidosFiltrados = pedidos.filter(p => p.status === statusColuna.nome);

      html += `
        <div class="kanban-coluna" style="border-top:5px solid ${statusColuna.cor};">
          <h2 class="kanban-titulo" style="color:${statusColuna.cor};">
            ${statusColuna.nome} (${pedidosFiltrados.length})
          </h2>`;

      if (pedidosFiltrados.length === 0) {
        html += `<p style="opacity:.6; text-align:center; margin-top:40px;">Nenhum pedido</p>`;
      }

      pedidosFiltrados.forEach(p => {
        html += `
          <div class="pedido-card">
            <div class="pedido-info">
              <strong style="color:var(--accent)">#${p.idPedido}</strong> 
              <span class="pedido-data">${p.data || p.dataHora || p.timestamp || 'Sem data'}</span><br><br>
              
              👤 ${p.cliente}<br>
              📞 ${p.telefone}<br><br>
              📍 ${p.endereco}

<br>

<button
  onclick="abrirMapa('${encodeURIComponent(p.endereco)}')"
  style="
    margin-top:8px;
    width:100%;
    background:#34a853;
    color:white;
    border:none;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
  "
>
  📍 Abrir no Maps
</button>

<br><br>
              🍔 ${p.itens}<br>
              
              <div class="pedido-total">R$ ${parseFloat(p.total || 0).toFixed(2)}</div>
            </div>
            
            <select id="status-${p.idPedido}" class="status-select">
              <option value="Pendente" ${p.status === "Pendente" ? "selected" : ""}>Pendente</option>
              <option value="Em preparo" ${p.status === "Em preparo" ? "selected" : ""}>Em preparo</option>
              <option value="Saiu para entrega" ${p.status === "Saiu para entrega" ? "selected" : ""}>Saiu para entrega</option>
              <option value="Entregue" ${p.status === "Entregue" ? "selected" : ""}>Entregue</option>
              <option value="Cancelado" ${p.status === "Cancelado" ? "selected" : ""}>Cancelado</option>
            </select>
            <button class="btn-primary btn-status" onclick="alterarStatus('${p.idPedido}')">Atualizar Status</button>
          </div>`;
      });

      html += `</div>`;
    });

    document.getElementById("pedidos-kanban").innerHTML = html;
  } catch (e) {
    console.log(e);
    document.getElementById("pedidos-kanban").innerHTML = "<p>Erro ao carregar pedidos.</p>";
  } finally {
    esconderLoading();
  }
}

// ==================== CANCELADOS ====================
async function carregarCancelados() {
  mostrarLoading();
  try {
    const res = await fetch(API + "?pedidos=1");
    const pedidos = await res.json();
    const cancelados = pedidos.filter(p => p.status === "Cancelado");

    let html = "";
    cancelados.forEach(p => {
      html += `
        <div class="card" style="border-left: 5px solid var(--red);">
          <strong style="color:var(--red)">Pedido #${p.idPedido}</strong> 
          <small style="color:#aaa;">${p.data || p.dataHora || ''}</small><br><br>
          👤 ${p.cliente}<br>
          📞 ${p.telefone}<br><br>
          💰 R$ ${parseFloat(p.total || 0).toFixed(2)}
        </div>`;
    });

    document.getElementById("cancelados").innerHTML = html || "<p>Nenhum pedido cancelado.</p>";
  } catch (e) {
    document.getElementById("cancelados").innerHTML = "<p>Erro ao carregar.</p>";
  } finally {
    esconderLoading();
  }
}

// ==================== PRODUTOS ====================
async function carregarProdutos() {
  mostrarLoading();
  try {
    const res = await fetch(API + "?produtos=1");
    const produtos = await res.json();

    let html = `<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:20px;">`;

    produtos.forEach(p => {
      html += `
        <div class="card" style="text-align:center;">
          <img src="${p.imagem || 'https://placehold.co/600x400'}" 
               style="width:100%; height:180px; object-fit:cover; border-radius:12px;">
          <h3 style="margin:12px 0 8px;">${p.nome}</h3>
          <h2 style="color:var(--green);">R$ ${parseFloat(p.preco).toFixed(2)}</h2>
          <p>${p.categoria || ""}</p>
          <div style="margin-top:12px;">
            <button class="btn-primary" onclick="editarProduto('${p.id}')">✏️ Editar</button>
            <button class="btn-danger" onclick="excluirProduto('${p.id}')">🗑 Excluir</button>
          </div>
        </div>`;
    });

    html += `</div>`;
    document.getElementById("listaProdutos").innerHTML = html || "<p>Nenhum produto cadastrado.</p>";
  } catch (e) {
    document.getElementById("listaProdutos").innerHTML = "<p>Erro ao carregar produtos.</p>";
  } finally {
    esconderLoading();
  }
}

// ==================== MODAL PRODUTO ====================
function novoProduto() {
  produtoEditando = null;
  document.getElementById("modalTitulo").textContent = "Novo Produto";
  document.getElementById("prodNome").value = "";
  document.getElementById("prodPreco").value = "";
  document.getElementById("prodCategoria").value = "";
  document.getElementById("prodImagem").value = "";
  document.getElementById("modalProduto").style.display = "flex";
}

function editarProduto(id) {
  produtoEditando = id;
  document.getElementById("modalTitulo").textContent = "Editar Produto";
  document.getElementById("modalProduto").style.display = "flex";
}

function fecharModal() {
  document.getElementById("modalProduto").style.display = "none";
}

async function salvarModal() {
  const nome = document.getElementById("prodNome").value.trim();
  const preco = document.getElementById("prodPreco").value;
  const categoria = document.getElementById("prodCategoria").value.trim();
  const imagem = document.getElementById("prodImagem").value.trim();

  if (!nome || !preco) {
    alert("Nome e Preço são obrigatórios!");
    return;
  }

  const dados = {
    acao: "salvarProduto",
    id: produtoEditando,
    nome: nome,
    preco: preco,
    categoria: categoria,
    imagem: imagem || "https://placehold.co/600x400"
  };

  const resultado = await fazerRequisicao(dados);
  if (resultado.success) {
    alert("✅ Produto salvo com sucesso!");
    fecharModal();
    carregarProdutos();
  } else {
    alert("❌ Erro ao salvar produto");
  }
}

async function excluirProduto(id) {
  if (!confirm("Tem certeza que deseja excluir este produto?")) return;
  
  const resultado = await fazerRequisicao({ acao: "excluirProduto", id: id });
  if (resultado.success) {
    alert("🗑 Produto excluído!");
    carregarProdutos();
  } else {
    alert("❌ Erro ao excluir produto");
  }
}

// ==================== ALTERAR STATUS ====================
async function alterarStatus(idPedido) {
  const novoStatus = document.getElementById(`status-${idPedido}`).value;

  const resultado = await fazerRequisicao({
    acao: "alterarStatus",
    idPedido: idPedido,
    status: novoStatus
  });

  if (resultado.success) {
    alert("✅ Status atualizado!");
    carregarPedidos();
    carregarDashboard();
  } else {
    alert("❌ Erro ao atualizar status");
  }
}

// ==================== CONFIGURAÇÕES ====================
function salvarConfiguracoes() {
  localStorage.setItem("nomeLoja", document.getElementById("nomeLoja").value);
  localStorage.setItem("corSistema", document.getElementById("corSistema").value);
  localStorage.setItem("logoLoja", document.getElementById("logoLoja").value);
  localStorage.setItem("taxaEntrega", document.getElementById("taxaEntrega").value);
  localStorage.setItem("tempoEntrega", document.getElementById("tempoEntrega").value);
  localStorage.setItem("pedidoMinimo", document.getElementById("pedidoMinimo").value);
  localStorage.setItem("whatsappLoja", document.getElementById("whatsappLoja").value);
  localStorage.setItem("mensagemAuto", document.getElementById("mensagemAuto").value);

  aplicarConfiguracoes();
  alert("✅ Configurações salvas!");
}

function abrirMapa(endereco) {

  const url =
    `https://www.google.com/maps/search/?api=1&query=${endereco}`;

  window.open(url, "_blank");

}

function carregarConfiguracoes() {
  document.getElementById("nomeLoja").value = localStorage.getItem("nomeLoja") || "";
  document.getElementById("corSistema").value = localStorage.getItem("corSistema") || "#00d4ff";
  document.getElementById("logoLoja").value = localStorage.getItem("logoLoja") || "";
  document.getElementById("taxaEntrega").value = localStorage.getItem("taxaEntrega") || "";
  document.getElementById("tempoEntrega").value = localStorage.getItem("tempoEntrega") || "";
  document.getElementById("pedidoMinimo").value = localStorage.getItem("pedidoMinimo") || "";
  document.getElementById("whatsappLoja").value = localStorage.getItem("whatsappLoja") || "";
  document.getElementById("mensagemAuto").value = localStorage.getItem("mensagemAuto") || "";
}

function aplicarConfiguracoes() {
  const nome = localStorage.getItem("nomeLoja");
  const cor = localStorage.getItem("corSistema");

  if (nome) {
    document.querySelector("header h2").innerHTML = `🔧 ${nome}`;
  }
  if (cor) {
    document.documentElement.style.setProperty("--accent", cor);
  }
}

function toggleLoja() {
  const status = localStorage.getItem("lojaFechada");
  const btn = document.getElementById("btnLoja");

  if (status === "sim") {
    localStorage.setItem("lojaFechada", "nao");
    btn.innerHTML = "🟢 Loja Aberta";
    btn.style.background = "#00ff9d";
    btn.style.color = "#000";
  } else {
    localStorage.setItem("lojaFechada", "sim");
    btn.innerHTML = "🔴 Loja Fechada";
    btn.style.background = "#ff3b5c";
    btn.style.color = "#fff";
  }
}

// Auto login
if (localStorage.getItem("adminLogado")) {
  mostrarPainel();
}

aplicarConfiguracoes();
</script>
</body>
</html>
